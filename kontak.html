<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idham | Kontak</title>
  </head>
  <body>
    <header>
      <h1>Kontak</h1>
      <nav>
        <ul>
          <li>
            <a href="index.html">Beranda</a>
          </li>
          <li>
            <a href="kontak.html">Kontak</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <p>Hubungi saya</p>
      <form action="kontak.html" method="get">
        <label for="nama">Masukkan nama</label>
        <input type="text" id="nama" name="nama" required />
        <label for="email">Email anda</label>
        <input type="email" id="email" name="email" required />
        <label for="topik">Pilih Topik</label>
        <select name="topik" id="topik">
          <option value="1">Kontrak</option>
          <option value="2">Freelance</option>
          <option value="3">Personal</option>
        </select>
        <label for="pesan">Isi Pesan</label>
        <textarea rows="5" name="pesan" id="pesan" required></textarea>
        <button type="submit">Kirim</button>
      </form>
    </main>
    <footer>
      <p>Dibuat oleh <strong>Idham</strong></p>
    </footer>
  </body>
</html>
